[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asc-submit"
version = "0.2.3"
description = "Dependency-free CLI that ships an App Store version end to end: create the version, set What's New / descriptions / review notes / screenshots, attach a build, and submit for review."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Takeshi Kawai" }]
keywords = ["app-store-connect", "app-store", "submit", "release", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/takezou621/asc-submit"

[project.scripts]
asc-submit = "asc_submit.cli:main"

[tool.setuptools]
packages = ["asc_submit"]
